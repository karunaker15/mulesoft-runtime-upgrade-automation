name: Runtime Upgrade

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Repo
        uses: actions/checkout@v4

      - name: Clone Mule Repositories
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          while read repo
          do
            git clone https://${GH_TOKEN}@github.com/<YOUR_ORG>/$repo.git
          done < repos.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Runtime
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          while read repo
          do
            echo "Processing $repo"

            cd $repo

            git checkout -b runtime-upgrade-4.9

            python3 ../scripts/upgrade.py

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add .

            if git diff --staged --quiet; then
              echo "No changes found"
              cd ..
              continue
            fi

            git commit -m "Upgrade Mule Runtime from 4.6 to 4.9"

            git push origin runtime-upgrade-4.9

            cd ..

          done < repos.txt
