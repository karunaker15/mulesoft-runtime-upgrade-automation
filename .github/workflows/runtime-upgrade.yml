name: Runtime Upgrade

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Repo
        uses: actions/checkout@v4

      - name: Clone Mule Repositories
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          while read repo
          do
            git clone https://${GH_TOKEN}@github.com/karunaker15/$repo.git
          done < repos.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Runtime
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          while read repo
          do
            echo "Processing $repo"

            cd $repo
            BRANCH_NAME="runtime-upgrade-4.9"

            git checkout -b $BRANCH_NAME

            python3 ../scripts/upgrade.py

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add .

            if git diff --staged --quiet; then
              echo "No changes found"
              cd ..
              continue
            fi

            git commit -m "Upgrade Mule Runtime from 4.6 to 4.9"

            git push --force origin $BRANCH_NAME

            echo "Pull request created for $repo"

            gh pr create \
              --repo karunaker15/$repo \
              --title "Upgrade Mule Runtime from 4.6 to 4.9" \
              --body "This PR upgrades the Mule Runtime from version 4.6 to 4.9." \
              --base main \
              --head $BRANCH_NAME
              Automated runtime upgrade from 4.6 to 4.9
              Changes:
              - Upgraded Mule Runtime from 4.6 to 4.9.23
              - Updated Mule Maven Plugin to 4.9.1
              - Updated minMuleVersion to 4.9.0
              - Added Java 17 configuration
              - Added LTS Release Channel


          

            cd ..

          done < repos.txt
