name: Runtime Upgrade

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify GitHub Authentication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth status

      - name: Clone Mule Repositories
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          while read repo
          do
            echo "Cloning $repo"

            git clone https://${GH_TOKEN}@github.com/karunaker15/$repo.git || {
              echo "Failed to clone $repo"
            }

          done < repos.txt

      - name: Upgrade Runtime and Create PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |

          FAILED_REPOS=""

          while read repo
          do
            echo ""
            echo "===================================="
            echo "Processing $repo"
            echo "===================================="

            if ! cd "$repo"
            then
              echo "Repository folder not found"

              FAILED_REPOS="${FAILED_REPOS}
- ${repo} (Clone Failed)"

              continue
            fi

            BRANCH_NAME="runtime-upgrade-4.9"

            git checkout -B $BRANCH_NAME

            python3 ../scripts/upgrade.py || {
              echo "Python Script Failed"

              FAILED_REPOS="${FAILED_REPOS}
- ${repo} (Upgrade Script Failed)"

              cd ..
              continue
            }

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            echo ""
            echo "Git Status After Upgrade"
            git status

            echo ""
            echo "Modified Files"
            git diff --name-only

            git add .

            if git diff --cached --quiet
            then
              echo "No changes found in $repo"

              cd ..
              continue
            fi

            if ! git commit -m "Upgrade Mule Runtime from 4.6 to 4.9"
            then

              echo "Commit failed for $repo"

              FAILED_REPOS="${FAILED_REPOS}
- ${repo} (Commit Failed)"

              cd ..
              continue

            fi

            if ! git push --force origin $BRANCH_NAME
            then

              echo "Push failed for $repo"

              FAILED_REPOS="${FAILED_REPOS}
- ${repo} (Push Failed)"

              cd ..
              continue

            fi

            echo "Checking if PR already exists..."

            if gh pr view "$BRANCH_NAME" \
              --repo "karunaker15/$repo" >/dev/null 2>&1
            then

              echo "PR already exists for $repo"

            else

              echo "Creating PR for $repo"

              if ! gh pr create \
                --repo "karunaker15/$repo" \
                --base "main" \
                --head "$BRANCH_NAME" \
                --title "Upgrade Mule Runtime from 4.6 to 4.9" \
                --body "Automated Mule Runtime Upgrade. Updated Mule Runtime to 4.9.23, Mule Maven Plugin to 4.9.1, minMuleVersion to 4.9.0, Java Version 17, and Release Channel LTS."


              then

                echo "PR Creation Failed"

                FAILED_REPOS="${FAILED_REPOS}
- ${repo} (PR Creation Failed)"

              fi

            fi

            cd ..

          done < repos.txt

          echo ""
          echo "===================================="
          echo "UPGRADE EXECUTION SUMMARY"
          echo "===================================="

          if [ -z "$FAILED_REPOS" ]
          then

            echo "All repositories processed successfully."

          else

            echo ""
            echo "Failed Repositories:"
            echo "$FAILED_REPOS"

            exit 1

          fi
